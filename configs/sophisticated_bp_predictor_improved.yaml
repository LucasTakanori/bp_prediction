# Improved BP Predictor Configuration
# Addresses SBP/DBP prediction issues with enhanced architecture and loss weighting

environment:
  data_root: "/home/lucas_takanori/phd/data"
  experiments_root: "./experiments"
  cache_dir: "./cache"

data_config:
  # Path configuration
  root_path: "/home/lucas_takanori/phd/data"
  data_file: "subject001_baseline_masked.h5"
  subjects: ["subject001"]
  session: "baseline"
  
  # CRITICAL: Reduce overlap to prevent discrete patterns
  max_samples_per_subject: 1000  # Reduced to prevent overfitting
  sequence_step_size: 15  # INCREASED to reduce overlap and prevent block patterns
  
  # Data loading options
  preload_to_memory: false
  use_mmap: true
  force_reload: false
  return_metadata: true
  
  # Use multi-frame for better temporal information
  pattern_offsets: [-7 ,-6 ,-5, -4, -3, -2, -1, 0, 1, 2]  # Multi-frame temporal modeling
  sequence_length: 10
  
  # Data splits
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  
  # CRITICAL: Improved normalization for continuous predictions
  bp_normalization: [40.0, 200.0]
  frame_normalization: "vae_compatible"  # Match VAE training
  
  # NO noise augmentation as requested
  use_augmentation: false
  noise_level: 0.0

model_config:
  model_type: "sophisticated_bp_predictor"
  
  # VAE Configuration - Keep same size
  vae_config:
    latent_dim: 128  # Keep original size
    freeze_vae: true
    vae_checkpoint_path: "/home/lucas_takanori/phd/bp_prediction/experiments/experiment_20250616_223305/checkpoints/vae_best.pt"
  
  # BiLSTM Configuration - Keep same size
  bilstm_config:
    input_dim: 64
    hidden_dim: 128  # Keep original size
    num_layers: 2    # Keep original depth
    output_dim: 50
    bidirectional: true
    dropout_rate: 0.3  # Moderate dropout
    
  # Multi-Head Self-Attention Configuration - Keep same size
  attention_config:
    use_attention: true
    attention_type: "multi_head_self_attention"
    attention_dim: 64
    num_attention_heads: 4  # Keep original size
    attention_dropout: 0.2
    current_frame_bias: 2  # Moderate bias to prevent overemphasis
    use_physiological_features: true
    
  # Auxiliary Prediction Heads
  auxiliary_heads:
    use_auxiliary_heads: true
    systolic_head: true
    diastolic_head: true
    
  # Advanced Features
  advanced_features:
    use_residual_connections: true
    use_layer_norm: true
    use_gradient_checkpointing: false

training_config:
  # Basic training parameters
  num_epochs: 60  # More epochs for better convergence
  batch_size: 4   # Slightly larger for stability
  learning_rate: 0.0005  # Higher learning rate for better gradient flow
  optimizer: "adamw"
  weight_decay: 1e-5  # Standard regularization
  
  # Advanced optimizer settings
  optimizer_config:
    betas: [0.9, 0.999]
    eps: 1e-8
    amsgrad: true
  
  # Learning rate scheduler
  scheduler_config:
    use_scheduler: true
    scheduler_type: "reduce_on_plateau"
    scheduler_patience: 6  # Faster adaptation
    factor: 0.7
    min_lr: 1e-7
    
  # Mixed precision and optimization
  optimization:
    use_mixed_precision: false
    grad_clip_norm: 0.5  # Tighter gradient clipping
    accumulate_grad_batches: 1  # No accumulation for direct gradients
    
  # Early stopping
  early_stopping:
    patience: 12
    min_delta: 0.001
    monitor: "val_mae"
    mode: "min"
    
  # Checkpointing
  checkpointing:
    save_every_n_epochs: 5
    save_best_only: true
    save_last: true
    monitor: "val_mae"
    
  # Validation
  validation:
    check_val_every_n_epoch: 1
    val_check_interval: 1.0

loss_config:
  # CRITICAL: Rebalanced loss for continuous predictions
  loss_type: "composite"
  
  # More balanced loss weights to encourage smooth learning
  loss_weights:
    waveform_weight: 0.5   # Higher emphasis on overall shape
    systolic_weight: 0.25  # Balanced with waveform
    diastolic_weight: 0.25 # Balanced with waveform
    
  # Advanced loss parameters - Keep Huber loss as requested
  loss_params:
    reduction: "mean"
    label_smoothing: 0.0
    huber_delta: 1.0  # Standard Huber delta for smoothness
    
  # Improved BP extraction for continuous values
  bp_extraction:
    systolic_method: "max_with_smoothing"  # Smooth extraction
    diastolic_method: "min_after_systolic_smoothed"  # Smooth extraction
    
  # Normalization for loss calculation
  normalize_for_loss: false
  bp_norm_range: [40.0, 200.0]
  
  # Physiological constraints with lighter weight
  physiological_constraint: true
  pulse_pressure_weight: 0.05  # Lighter constraint

logging_config:
  level: "INFO"
  log_every_n_steps: 25
  
  wandb:
    use_wandb: false
    project: "improved-bp-prediction"
    mode: "offline"
    tags: ["improved", "continuous", "fixed-blocks"]
    group: "improved_bp_predictor"
    
  visualization:
    visualize_attention: true
    plot_predictions: true
    save_prediction_plots: true
    plot_every_n_epochs: 5
    num_examples_to_plot: 5

evaluation_config:
  metrics_to_track:
    - "systolic_mae"
    - "diastolic_mae" 
    - "pulse_pressure_mae"
    - "waveform_correlation"
    - "clinical_accuracy"
  
  clinical_thresholds: [5, 10, 15]
  
  # Focus on continuous prediction quality
  prediction_quality:
    check_continuity: true
    smoothness_penalty: true
    correlation_focus: true

hardware_config:
  device: "auto"
  num_workers: 16
  pin_memory: true
  persistent_workers: true
  
  memory_optimization:
    empty_cache_every_n_steps: 50
    max_memory_usage: 0.8

output_config:
  output_dir: "./experiments/improved_bp_predictor_continuous_10_frames_2{timestamp}"
  experiment_name: "improved_bp_predictor_continuous_10_frames_2{timestamp}"
  
  save_results:
    save_predictions: true
    save_attention_weights: true
    save_model_summary: true
    save_config: true
    
  checkpoint_naming:
    use_timestamp: true
    include_metrics: true

experiment_info:
  name: "improved_bp_predictor_continuous"
  description: |
    Fixed blood pressure prediction system addressing:
    - Block-like Bland-Altman patterns by reducing data overlap
    - Poor R² scores through better loss balancing
    - Continuous prediction learning
    - Smooth BP value extraction
    - No noise augmentation
    - Same model size maintained
  version: "2.1.0"
  author: "Improved BP Prediction System"
  created_date: "2025-01-17"

advanced_config:
  seed: 42
  deterministic: true
  benchmark: false
  
  debug_mode: false
  profile_model: false
  detect_anomaly: false
  
  distributed:
    use_ddp: false
    backend: "nccl"
    find_unused_parameters: false

normalization:
  bp_min: 40.0
  bp_max: 200.0 