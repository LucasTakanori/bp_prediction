# Test VAE Configuration for Training Examples
# This config demonstrates all available parameters

environment:
  data_root: "${BP_DATA_ROOT:/home/lucas_takanori/phd/data}"
  experiments_root: "${BP_EXPERIMENTS_ROOT:./experiments}"
  cache_dir: "${BP_CACHE_DIR:./cache}"

data_config:
  # Path configuration
  root_path: "${BP_DATA_ROOT:/home/lucas_takanori/phd/data}"
  subject: "subject001"
  session: "baseline"
  cache_dir: "${BP_CACHE_DIR:./cache}"
  
  # Data loading options
  preload_to_memory: false
  use_mmap: true
  force_reload: false
  return_metadata: true
  
  # Sequence parameters
  sequence_length: 3
  pattern_offsets: [-7, 0, 3]
  
  # Normalization parameters
  bp_normalization: [40.0, 200.0]
  frame_normalization: "minmax"  # "minmax", "standardize", "none"

model_config:
  model_type: "vae"
  
  # VAE architecture - small for quick testing
  latent_dim: 128
  input_channels: 1
  input_height: 32
  input_width: 32
  hidden_dims: [32, 64, 128]
  
  # Training parameters
  dropout_rate: 0.2
  activation: "relu"
  use_batch_norm: true

training_config:
  # Basic training parameters - extended for proper testing
  num_epochs: 10
  batch_size: 8
  learning_rate: 1e-3
  optimizer: "adam"
  weight_decay: 1e-5
  
  # VAE-specific parameters
  beta_min: 0.01
  beta_max: 0.5
  beta_warmup_epochs: 3
  
  # Scheduler
  use_scheduler: true
  scheduler_type: "cosine"
  
  # Mixed precision and optimization
  use_mixed_precision: false
  grad_clip_norm: 1.0
  
  # Early stopping
  early_stopping_patience: 10
  early_stopping_min_delta: 1e-4
  
  # Checkpointing
  save_every_n_epochs: 2
  
  # Output
  output_dir: "${BP_EXPERIMENTS_ROOT:./experiments}"

logging_config:
  level: "INFO"
  use_wandb: true
  wandb_project: "${WANDB_PROJECT:bp-prediction-test}"
  wandb_mode: "offline"  # online, offline, disabled
  
# Experiment metadata
experiment_name: "vae_test"
description: "Quick VAE test configuration for demonstration" 