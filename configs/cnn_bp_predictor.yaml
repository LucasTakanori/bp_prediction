# CNN-Based BP Predictor Configuration
# Uses custom lightweight CNN instead of VAE for feature extraction

environment:
  data_root: "/home/lucas_takanori/phd/data"
  experiments_root: "./experiments"
  cache_dir: "./cache"

data_config:
  # Path configuration
  root_path: "/home/lucas_takanori/phd/data"
  data_file: "subject001_baseline_masked.h5"
  subjects: ["subject001"]
  session: "baseline"
  
  # Reduce overlap to prevent discrete patterns
  max_samples_per_subject: 1000
  sequence_step_size: 15  # Reduced overlap
  
  # Data loading options
  preload_to_memory: false
  use_mmap: true
  force_reload: false
  return_metadata: true
  
  # Multi-frame temporal modeling
  pattern_offsets: [-7, -6, -5, -4, -3, -2, -1, 0, 1, 2]
  sequence_length: 10
  
  # Data splits
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  
  # Improved normalization for continuous predictions
  bp_normalization: [40.0, 200.0]
  frame_normalization: "zero_one"  # Standard 0-1 normalization for CNN
  
  # No noise augmentation
  use_augmentation: false
  noise_level: 0.0

model_config:
  model_type: "cnn_bp_predictor"
  
  # CNN Feature Extractor Configuration
  cnn_config:
    input_channels: 1
    feature_dim: 128  # Output features from CNN
    use_batch_norm: true
    dropout_rate: 0.2
    
  # BiLSTM Configuration
  bilstm_config:
    input_dim: 128  # Matches CNN output
    hidden_dim: 128
    num_layers: 2
    output_dim: 50
    bidirectional: true
    dropout_rate: 0.3
    
  # Multi-Head Self-Attention Configuration
  attention_config:
    use_attention: true
    attention_type: "multi_head_self_attention"
    attention_dim: 64
    num_attention_heads: 4
    attention_dropout: 0.2
    current_frame_bias: 1.5
    use_physiological_features: false
    
  # Auxiliary Prediction Heads
  auxiliary_heads:
    use_auxiliary_heads: true
    systolic_head: true
    diastolic_head: true
    
  # Advanced Features
  advanced_features:
    use_residual_connections: true
    use_layer_norm: true
    use_gradient_checkpointing: false

training_config:
  # Basic training parameters
  num_epochs: 80
  batch_size: 8
  learning_rate: 0.001  # Slightly higher for end-to-end training
  optimizer: "adamw"
  weight_decay: 1e-4
  
  # Advanced optimizer settings
  optimizer_config:
    betas: [0.9, 0.999]
    eps: 1e-8
    amsgrad: true
  
  # Learning rate scheduler
  scheduler_config:
    use_scheduler: true
    scheduler_type: "reduce_on_plateau"
    scheduler_patience: 6
    factor: 0.7
    min_lr: 1e-6
    
  # Mixed precision and optimization
  optimization:
    use_mixed_precision: false
    grad_clip_norm: 0.5
    accumulate_grad_batches: 1
    
  # Early stopping
  early_stopping:
    patience: 15
    min_delta: 0.001
    monitor: "val_mae"
    mode: "min"
    
  # Checkpointing
  checkpointing:
    save_every_n_epochs: 5
    save_best_only: true
    save_last: true
    monitor: "val_mae"
    
  # Validation
  validation:
    check_val_every_n_epoch: 1
    val_check_interval: 1.0

loss_config:
  # Composite loss for end-to-end training
  loss_type: "composite"
  
  # Balanced loss weights
  loss_weights:
    waveform_weight: 0.4
    systolic_weight: 0.3
    diastolic_weight: 0.3
    
  # Loss parameters
  loss_params:
    reduction: "mean"
    label_smoothing: 0.0
    huber_delta: 1.0
    
  # BP extraction methods
  bp_extraction:
    systolic_method: "max_with_smoothing"
    diastolic_method: "min_after_systolic_smoothed"
    
  # Normalization for loss calculation
  normalize_for_loss: false
  bp_norm_range: [40.0, 200.0]
  
  # Physiological constraints
  physiological_constraint: true
  pulse_pressure_weight: 0.05

logging_config:
  level: "INFO"
  log_every_n_steps: 25
  
  wandb:
    use_wandb: false
    project: "cnn-bp-prediction"
    mode: "offline"
    tags: ["cnn", "end-to-end", "custom-features"]
    group: "cnn_bp_predictor"
    
  visualization:
    visualize_attention: true
    plot_predictions: true
    save_prediction_plots: true
    plot_every_n_epochs: 5
    num_examples_to_plot: 5

evaluation_config:
  metrics_to_track:
    - "systolic_mae"
    - "diastolic_mae" 
    - "pulse_pressure_mae"
    - "waveform_correlation"
    - "clinical_accuracy"
  
  clinical_thresholds: [5, 10, 15]
  
  prediction_quality:
    check_continuity: true
    smoothness_penalty: true
    correlation_focus: true

hardware_config:
  device: "auto"
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  
  memory_optimization:
    empty_cache_every_n_steps: 50
    max_memory_usage: 0.8

output_config:
  output_dir: "./experiments/cnn_bp_predictor_{timestamp}"
  experiment_name: "cnn_bp_predictor_{timestamp}"
  
  save_results:
    save_predictions: true
    save_attention_weights: true
    save_model_summary: true
    save_config: true
    
  checkpoint_naming:
    use_timestamp: true
    include_metrics: true

experiment_info:
  name: "cnn_bp_predictor"
  description: |
    CNN-based blood pressure prediction system:
    - Custom lightweight CNN for feature extraction
    - End-to-end training (no frozen components)
    - Task-specific optimization for BP prediction
    - Same temporal modeling as VAE version
    - Direct comparison with VAE approach
  version: "1.0.0"
  author: "CNN BP Prediction System"
  created_date: "2025-01-17"

advanced_config:
  seed: 42
  deterministic: true
  benchmark: false
  
  debug_mode: false
  profile_model: false
  detect_anomaly: false
  
  distributed:
    use_ddp: false
    backend: "nccl"
    find_unused_parameters: false

normalization:
  bp_min: 40.0
  bp_max: 200.0 