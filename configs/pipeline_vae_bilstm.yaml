# Continuous VAE + BiLSTM Pipeline Configuration
# Trains VAE first, then uses it as frozen encoder for BiLSTM training
# Ensures no data leakage with consistent 90/10 split

environment:
  data_root: "${BP_DATA_ROOT:/gpfs/projects/bsc88/speech/research/scripts/Lucas/bp_prediction/data}"
  experiments_root: "${BP_EXPERIMENTS_ROOT:/gpfs/projects/bsc88/speech/research/scripts/Lucas/bp_prediction/experiments}"
  cache_dir: "${BP_CACHE_DIR:/gpfs/projects/bsc88/speech/research/scripts/Lucas/bp_prediction/cache}"

# Pipeline-specific configuration
pipeline_config:
  data_split_ratio: 0.9  # 90% train, 10% validation
  data_split_seed: 42    # For reproducible splits
  subjects: "auto"       # Will auto-detect all available subjects
  max_subjects: null     # Use all available subjects
  exclude_subjects: []   # List of subjects to exclude
  session: "baseline"
  
  # Memory management
  clear_gpu_memory_between_phases: true
  memory_cleanup_every_n_epochs: 1000
  
  # Phase control
  phases:
    - "vae_training"
    - "bilstm_training"
    - "pipeline_evaluation"

# VAE Training Phase Configuration
vae_phase:
  model_config:
    model_type: "vae"
    latent_dim: 128  # Increased from 64 to 128 for better feature representation
    input_channels: 1
    input_height: 32
    input_width: 32
    hidden_dims: [64, 128, 256, 512]
    dropout_rate: 0.2
    activation: "relu"
    use_batch_norm: true
  
  training_config:
    num_epochs: 5
    batch_size: 256
    learning_rate: 1e-4
    optimizer: "adam"
    weight_decay: 1e-4
    
    # VAE-specific parameters
    beta_min: 0.01
    beta_max: 0.35
    beta_warmup_epochs: 50
    
    # Scheduler
    use_scheduler: true
    scheduler_type: "cosine"
    
    # Optimization
    use_mixed_precision: false
    grad_clip_norm: 1.0
    
    # Early stopping
    early_stopping_patience: 1000
    early_stopping_min_delta: 1e-4
    
    # Checkpointing
    save_every_n_epochs: 5
    save_best_only: true
    save_last: true

# BiLSTM Training Phase Configuration
bilstm_phase:
  # Data configuration for temporal sequences
  data_config:
    sequence_length: 10  # 10-frame sequences for temporal context
    pattern_offsets: [-7, -6, -5, -4, -3, -2, -1, 0, 1, 2]  # Temporal offsets
    sequence_step_size: 15  # Reduce overlap for better generalization
    max_samples_per_subject: 200  # Limit samples per subject
    frame_normalization: "zero_one"  # Normalize to [0, 1] range
    bp_normalization: [40.0, 200.0]  # BP range in mmHg
    use_augmentation: false
    noise_level: 0.005
  
  model_config:
    model_type: "vae_bilstm"
    
    # VAE Configuration (frozen feature extractor)
    vae_config:
      latent_dim: 128  # Must match VAE training
      freeze_vae: true  # Freeze VAE weights during training
    
    # BiLSTM Configuration
    bilstm_config:
      input_dim: 128  # Must match VAE latent_dim
      hidden_dim: 256  # Increased for better representation
      num_layers: 3   # Deep network for complex patterns
      output_dim: 50  # BP signal length
      bidirectional: true
      dropout_rate: 0.3
      use_attention: true
      attention_heads: 8  # Multi-head attention
    
    # Attention configuration
    attention_config:
      use_attention: true
      num_attention_heads: 8
      current_frame_bias: 3.0  # Strong bias toward current frame
      use_physiological_features: true
  
  training_config:
    num_epochs: 5
    batch_size: 512
    learning_rate: 5e-4
    optimizer: "adamw"
    weight_decay: 1e-5
    
    # Optimizer settings
    optimizer_config:
      betas: [0.9, 0.999]
      eps: 1e-8
      amsgrad: false
    
    # Learning rate scheduler
    use_scheduler: true
    scheduler_type: "reduce_on_plateau"
    scheduler_patience: 8
    factor: 0.7
    min_lr: 1e-7
    
    # Optimization
    use_mixed_precision: false
    grad_clip_norm: 1.0
    
    # Early stopping
    early_stopping_patience: 15
    early_stopping_min_delta: 1e-5
    
    # Checkpointing
    save_every_n_epochs: 5
    save_best_only: true
    save_last: true

# Loss configuration for BiLSTM
loss_config:
  loss_type: "composite"
  
  # Balanced loss weights
  waveform_weight: 0.4
  systolic_weight: 0.3
  diastolic_weight: 0.3
  pulse_pressure_weight: 0.1
  
  # Loss parameters
  huber_delta: 1.0
  reduction: "mean"
  
  # Physiological constraints
  physiological_constraint: true
  min_pulse_pressure: 15.0

# Logging configuration
logging_config:
  level: "INFO"
  log_every_n_steps: 25
  
  # Weights & Biases logging
  use_wandb: false
  wandb_project: "pipeline-vae-bilstm"
  wandb_mode: "online"
  
  # Visualization settings
  visualize_predictions: true
  save_prediction_plots: true
  plot_every_n_epochs: 10
  num_examples_to_plot: 8

# Evaluation configuration
evaluation_config:
  max_eval_samples: 500
  metrics_to_track:
    - "systolic_r2"
    - "diastolic_r2"
    - "systolic_mae"
    - "diastolic_mae"
    - "waveform_r2"
    - "clinical_accuracy"
  
  # Clinical accuracy thresholds
  clinical_thresholds: [5, 10, 15]
  
  # Performance targets
  performance_targets:
    systolic_r2_target: 0.85
    diastolic_r2_target: 0.80
    systolic_mae_target: 8.0
    diastolic_mae_target: 6.0

# Hardware configuration
hardware_config:
  device: "auto"
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  empty_cache_every_n_steps: 50
  max_memory_usage: 0.85

# Experiment metadata
experiment_info:
  name: "pipeline_vae_bilstm"
  description: |
    Continuous VAE + BiLSTM training pipeline for blood pressure prediction.
    Trains VAE first as feature extractor, then BiLSTM for temporal modeling.
    Ensures no data leakage with consistent 90/10 split across both phases.
  version: "1.0.0"
  author: "Pipeline VAE BiLSTM System"
  created_date: "2025-01-17" 