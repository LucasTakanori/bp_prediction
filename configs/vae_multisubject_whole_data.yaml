# Multi-Subject VAE Configuration for Whole Data (No Masking)
# Based on train_enhanced.py approach - image in, image out without normalization
# Uses ALL available data without any masking

environment:
  data_root: "${BP_DATA_ROOT:/gpfs/projects/bsc88/speech/research/scripts/Lucas/bp_prediction/data}"
  experiments_root: "${BP_EXPERIMENTS_ROOT:/gpfs/projects/bsc88/speech/research/scripts/Lucas/bp_prediction/experiments}"
  cache_dir: "${BP_CACHE_DIR:/gpfs/projects/bsc88/speech/research/scripts/Lucas/bp_prediction/cache}"

data_config:
  # Path configuration
  root_path: "${BP_DATA_ROOT:/gpfs/projects/bsc88/speech/research/scripts/Lucas/bp_prediction/data}"
  subject: "subject001"  # Will be overridden by multisubject logic
  session: "baseline"
  cache_dir: "${BP_CACHE_DIR:/gpfs/projects/bsc88/speech/research/scripts/Lucas/bp_prediction/cache}"
  
  # Data loading options - using basic PviDataset (no masking)
  preload_to_memory: false
  use_mmap: true
  force_reload: false
  return_metadata: true

model_config:
  model_type: "vae"
  
  # VAE architecture (same as working baseline)
  latent_dim: 128
  input_channels: 1
  input_height: 32
  input_width: 32
  hidden_dims: [64, 128, 256, 512]
  
  # Training parameters (same as working baseline)
  dropout_rate: 0.2
  activation: "relu"
  use_batch_norm: true

training_config:
  # Basic training parameters (proven settings)
  num_epochs: 100
  batch_size: 64  # Same as before
  learning_rate: 1e-4
  optimizer: "adam"
  weight_decay: 1e-4
  
  # VAE-specific parameters (same as working baseline)
  beta_min: 0.01
  beta_max: 0.35
  beta_warmup_epochs: 50
  
  # Scheduler (same as working baseline)
  use_scheduler: true
  scheduler_type: "cosine"
  
  # Mixed precision and optimization (same as working baseline)
  use_mixed_precision: false
  grad_clip_norm: 1.0
  
  # Early stopping (same as working baseline)
  early_stopping_patience: 1000
  early_stopping_min_delta: 1e-4
  
  # Checkpointing (same as working baseline)
  save_every_n_epochs: 5
  
  # Output
  output_dir: "${BP_EXPERIMENTS_ROOT:/gpfs/projects/bsc88/speech/research/scripts/Lucas/bp_prediction/experiments}"

logging_config:
  level: "INFO"
  use_wandb: false  # Can be enabled with --wandb flag
  wandb_project: "${WANDB_PROJECT:multisubject-vae-whole-data}"
  wandb_mode: "online"  # online, offline, disabled
  
# Experiment metadata
experiment_name: "multisubject_vae_whole_data"
description: "Multi-subject VAE training using WHOLE DATA (no masking) like train_enhanced.py - image in, image out" 